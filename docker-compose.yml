services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./deploy/nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./deploy/nginx/bootstrap.conf:/etc/nginx/bootstrap.conf:ro
      - ./deploy/nginx/tls.conf:/etc/nginx/tls.conf:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-comemos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell for local development}
      DB_NAME: ${POSTGRES_DB:-comemos}
      AUTH_RATE_LIMIT_HMAC_KEY: ${AUTH_RATE_LIMIT_HMAC_KEY:?Set AUTH_RATE_LIMIT_HMAC_KEY in your shell for local development}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in your shell for password reset links}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://gonzalodeniz.com}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailhog}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Comemos en casa <no-reply@localhost>}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS:-false}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comemos}
      POSTGRES_USER: ${POSTGRES_USER:-comemos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell for local development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app_network

networks:
  app_network:
    name: comemos-dev

volumes:
  certbot_webroot:
  letsencrypt:
  postgres_data:
