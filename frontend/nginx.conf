server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 204; }
    location = /comemos { return 308 /comemos/; }
    location = /comemos/ { try_files /index.html =404; }
    location ^~ /comemos/ {
        rewrite ^/comemos/(.*)$ /$1 break;
        try_files $uri $uri/ @spa;
    }
    location @spa { try_files /index.html =404; }
    location / { return 404; }
}
