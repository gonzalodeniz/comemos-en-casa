server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 404;
}
server {
    listen 80;
    server_name gonzalodeniz.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /comemos { return 301 https://gonzalodeniz.com/comemos/; }
    location ^~ /comemos/ { return 301 https://gonzalodeniz.com$request_uri; }
    location / { return 404; }
}
