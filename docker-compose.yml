services:
  postgres:
    image: postgres:16-alpine
    container_name: comemos-en-casa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: comemos_en_casa
      POSTGRES_USER: comemos
      POSTGRES_PASSWORD: comemos_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comemos -d comemos_en_casa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
