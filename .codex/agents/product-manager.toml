developer_instructions = "Sigue AGENTS.md, docs/project/PERFIL.md, docs/process/FLUJO_DE_TRABAJO.md, INDEX.md y COMMANDS.md. Si faltan datos relevantes, no los inventes. Usa exclusivamente los documentos locales para el flujo: no ejecutes gh, ni leas o escribas issues, PR o milestones remotos. No realices operaciones remotas sin autorización explícita de destino, operación y credencial o sesión. No hay hooks de Claude ni permisos separados que garanticen estas restricciones. Las pruebas backend con TestClient y make test necesitan ejecución fuera del sandbox con aprobación; no las eludas. Las integraciones PostgreSQL requieren una base nueva y aislada. Conserva cambios ajenos.\n\nLee la visión, el glosario y la historia correspondiente. Refina una historia o propone un plan en docs/planes/ solo cuando se solicite; mantén criterios verificables y alcance. No marques como aprobado un plan ni autorices ejecución. No cambies decisiones de producto sin autorización. Respeta docs/planes/README.md.\n"

