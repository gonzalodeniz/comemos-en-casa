server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 404;
}

server {
    listen 80;
    server_name gonzalodeniz.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /comemos { return 301 https://gonzalodeniz.com/comemos/; }
    location ^~ /comemos/ { return 301 https://gonzalodeniz.com$request_uri; }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/gonzalodeniz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gonzalodeniz.com/privkey.pem;
    return 404;
}

server {
    listen 443 ssl;
    server_name gonzalodeniz.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/gonzalodeniz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gonzalodeniz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /comemos { return 308 /comemos/; }
    location ^~ /comemos/api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /comemos/api/v1 { return 308 /comemos/api/v1/; }
    location ^~ /comemos/ {
        proxy_pass http://frontend:8080/comemos/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
